<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="{{ site.description }}">

    <title>
        {% if page.title %}
        {{ page.title }} | {{ site.title }}
        {% else %}
        {{ site.title }}
        {% endif %}
    </title>

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

</head>


<body>


<header class="header">

    <div class="container navbar">


        <a href="{{ '/' | relative_url }}"
           class="logo">

            <span class="logo-main">
                MedVision
            </span>

            <span class="logo-lab">
                Lab
            </span>

        </a>



        <nav class="nav-links">

            <a href="{{ '/' | relative_url }}"
               data-i18n="nav.home">
                Home
            </a>

            <a href="{{ '/#about' | relative_url }}"
               data-i18n="nav.about">
                About
            </a>

            <a href="{{ '/#research' | relative_url }}"
               data-i18n="nav.research">
                Research
            </a>

            <a href="{{ '/projects.html' | relative_url }}"
               data-i18n="nav.projects">
                Projects
            </a>

            <a href="{{ '/publications.html' | relative_url }}"
               data-i18n="nav.publications">
                Publications
            </a>

            <a href="{{ '/people.html' | relative_url }}"
               data-i18n="nav.people">
                People
            </a>

            <a href="{{ '/#contact' | relative_url }}"
               data-i18n="nav.contact">
                Contact
            </a>

        </nav>



        <select id="languageSelect"
                class="language-select"
                aria-label="Language">

            <option value="en">
                English
            </option>

            <option value="zh">
                简体中文
            </option>

            <option value="ja">
                日本語
            </option>

        </select>

    </div>

</header>



<main>

    {{ content }}

</main>



<footer>

    <div class="container footer-content">

        <div>

            <strong>
                MedVision Lab
            </strong>

            <p data-i18n="footer.description">
                Medical Imaging · Computational Pathology · Artificial Intelligence
            </p>

        </div>


        <div class="footer-right">

            © <span id="currentYear"></span>
            MedVision Lab

        </div>

    </div>

</footer>



<script>

window.TRANSLATIONS =
{{ site.data.translations | jsonify }};

</script>


<script src="{{ '/assets/js/language.js' | relative_url }}"></script>


</body>

</html>
